# Phase 212 (KACT-03, KPRV-01, KPRV-03; D-01, D-02, D-04, D-06, D-10, D-11): the pull-request check.
#
# The job `okf-check` is the REQUIRED status check of a KB repository. Its conclusion is the
# engine's `check` exit code: 0 green, 1 red, anything else red ("no check completed").
#
#   - Never add a path or branch filter to this workflow: a skipped required check blocks
#     merges for ever.
#   - No secret, no write token. The workflow runs on `pull_request`, with `contents: read`,
#     and only restores the engine from the default branch's cache (`cache-mode: read`); a PR
#     can never write the cache. If the engine is not seeded the job fails with the exact
#     instruction (D-02): run the Seed workflow on the default branch.
#   - Fork PRs run the same way once the repository allows workflows from forks (they get no
#     secrets, and none is needed).
#   - A PR can edit this file, the actions and the engine pin it runs from. The protection is
#     code-owner review of /.github/ and /.okf/ (CODEOWNERS plus the ruleset "require review
#     from Code Owners"), never trust in the PR's own files. The job summary warns when a PR
#     touches those paths.
#   - Trusted human review (--trusted-human-review) comes only from `.okf/maintainers` as it
#     exists on the DEFAULT BRANCH (D-10); the author's association is never consulted.
#
# Stage 1 of the PR preview (D-06): this job uploads the artifact `okf-preview` (comment.md and
# pr.json). The workflow okf-preview-comment.yml, triggered by this workflow's completion, is
# the only one that holds a write token and posts the sticky comment. Presentation is best
# effort: the summary-part and upload steps cannot fail the job, and the last step decides the
# conclusion from the check exit code alone.
name: okf-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

cache-mode: read

concurrency:
  group: okf-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  okf-check:
    name: okf-check
    runs-on: ${{ vars.OKF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the pinned engine
        id: engine
        uses: ./.github/actions/okf-engine
        with:
          mode: restore

      - name: Run okf-check
        id: check
        uses: ./.github/actions/okf-check
        with:
          engine: ${{ steps.engine.outputs.engine }}
          version-line: ${{ steps.engine.outputs.version-line }}
          pinned-sha256: ${{ steps.engine.outputs.binary-sha256 }}
          bundle-path: ${{ vars.OKF_BUNDLE_PATH || 'bundle' }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          author-login: ${{ github.event.pull_request.user.login }}
          author-type: ${{ github.event.pull_request.user.type }}
          default-branch: ${{ github.event.repository.default_branch }}
          out-dir: ${{ runner.temp }}/okf-check

      # D-11: the engine splits the job summary into up to five parts, each its own step, so each
      # stays under GitHub's 1 MiB per-step limit and every finding is listed. A step whose part
      # does not exist is skipped; a missing, symlinked or oversize part becomes a fixed notice.
      - name: okf-check summary part 1
        if: always() && steps.check.outputs.summary-parts >= 1
        continue-on-error: true
        env:
          OKF_SUMMARY_PART: ${{ steps.check.outputs.summary-dir }}/summary-1.md
        run: bash .github/actions/okf-check/run-check.sh --append-summary "$OKF_SUMMARY_PART"

      - name: okf-check summary part 2
        if: always() && steps.check.outputs.summary-parts >= 2
        continue-on-error: true
        env:
          OKF_SUMMARY_PART: ${{ steps.check.outputs.summary-dir }}/summary-2.md
        run: bash .github/actions/okf-check/run-check.sh --append-summary "$OKF_SUMMARY_PART"

      - name: okf-check summary part 3
        if: always() && steps.check.outputs.summary-parts >= 3
        continue-on-error: true
        env:
          OKF_SUMMARY_PART: ${{ steps.check.outputs.summary-dir }}/summary-3.md
        run: bash .github/actions/okf-check/run-check.sh --append-summary "$OKF_SUMMARY_PART"

      - name: okf-check summary part 4
        if: always() && steps.check.outputs.summary-parts >= 4
        continue-on-error: true
        env:
          OKF_SUMMARY_PART: ${{ steps.check.outputs.summary-dir }}/summary-4.md
        run: bash .github/actions/okf-check/run-check.sh --append-summary "$OKF_SUMMARY_PART"

      - name: okf-check summary part 5
        if: always() && steps.check.outputs.summary-parts >= 5
        continue-on-error: true
        env:
          OKF_SUMMARY_PART: ${{ steps.check.outputs.summary-dir }}/summary-5.md
        run: bash .github/actions/okf-check/run-check.sh --append-summary "$OKF_SUMMARY_PART"

      # The artifact the poster workflow consumes: exactly comment.md and pr.json (D-06).
      - name: Upload the preview
        if: always() && steps.check.outputs.preview-dir != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okf-preview
          path: ${{ steps.check.outputs.preview-dir }}
          retention-days: 7

      # The complete findings (findings.json and the summary parts) for anyone reading the run.
      - name: Upload the findings
        if: always() && steps.check.outputs.findings-dir != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okf-findings
          path: ${{ steps.check.outputs.findings-dir }}
          retention-days: 14

      # The only step that decides the job's conclusion. A restore failure (D-02), an invalid
      # input or a check that did not complete leaves no check exit code, which is red.
      - name: okf-check verdict
        if: always()
        env:
          CHECK_EXIT: ${{ steps.check.outputs.check-exit }}
        run: |
          case "$CHECK_EXIT" in
            0) printf 'okf-check: PASS\n' ;;
            1) printf 'okf-check: FAIL\n'; exit 1 ;;
            *) printf 'okf-check: no check completed\n'; exit 2 ;;
          esac
